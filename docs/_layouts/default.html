<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title }}</title>

    <meta
      name="description"
      content="A modern desktop application for securely encrypting and decrypting files on Linux, Windows, and MacOS. The application uses AES-256 CBC encryption and is optimized for high performance with low memory usage."
    />
    <meta name="version" content="v2.1.0" />
    <meta name="author" content="ZHENG Robert" />
    <meta name="date" content="2025-12-24T10:45:00+01:00" />
    <meta
      name="keywords"
      content="File encryption, File decryption, Qt6, C++23, AES-256 CBC, ZHENG Bote, Robert Zheng"
    />

    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />

    <meta
      property="og:title"
      content="File Encryption & Decryption (Desktop)"
    />
    <meta
      property="og:description"
      content="A modern desktop application for securely encrypting and decrypting files on Linux, Windows, and MacOS. The application uses AES-256 CBC encryption and is optimized for high performance with low memory usage."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://zheng-bote.github.io/qt-desktop_file_encryption-decryption/"
    />
    <meta
      property="og:image"
      content="https://zheng-bote.github.io/qt-desktop_file_encryption-decryption/assets/img/icons/favicon.svg"
    />

    <link
      rel="shortcut icon"
      href="{{ '/assets/favicon.ico' | relative_url }}"
      type="image/x-icon"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="{{ '/assets/favicon.svg' | relative_url }}"
    />

    <link
      href="{{ '/assets/css/main.css' | relative_url }}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="{{ '/assets/css/structure.css' | relative_url }}"
      rel="stylesheet"
      type="text/css"
    />

    <link
      href="{{ '/assets/css/format.css' | relative_url }}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="{{ 'assets/css/image.css' | relative_url }}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="{{ '/assets/css/text.css' | relative_url }}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="{{ '/assets/css/coding.css' | relative_url }}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="{{ '/assets/css/attribute.css' | relative_url }}"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="{{ '/assets/css/links.css' | relative_url }}"
      rel="stylesheet"
      type="text/css"
    />
  </head>

  <body id="body" class="body">
    {% include header.html %} {% include aside.html %}

    <main id="main" class="main">
      {% include breadcrumbs.html %} {{ content }}
    </main>

    {% include footer.html %}
  </body>
</html>
