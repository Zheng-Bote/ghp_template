<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title }}</title>
    <link
      rel="stylesheet"
      href="{{ '/assets/css/style.css' | relative_url }}"
    />
    <link
      rel="stylesheet"
      href="{{ '/assets/css/dark.css' | relative_url }}"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="stylesheet"
      href="{{ '/assets/css/syntax.css' | relative_url }}"
    />
  </head>

  <body>
    {% include header.html %}

    <div class="layout">
      <aside class="sidebar">{% include sidebar.html %}</aside>

      <div class="architecture-sidebar">{% include toc.html %}</div>
      <main class="content">{% include breadcrumbs.html %} {{ content }}</main>
    </div>

    {% include footer.html %}

    <script>
      // Mobile-Menü Toggle
      function toggleMenu() {
        document.querySelector(".sidebar").classList.toggle("open");
      }
    </script>
  </body>
</html>
