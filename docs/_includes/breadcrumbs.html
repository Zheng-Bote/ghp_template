{% assign parts = page.url | split: '/' %}
<nav class="breadcrumbs">
  <a href="{{ '/' | relative_url }}">Home</a>
  {% assign path = '' %} {% for part in parts %} {% if part != "" %} {% assign
  path = path | append: '/' | append: part %} ›
  <a href="{{ path | append: '/' | relative_url }}"
    >{{ part | replace: '-', ' ' | capitalize }}</a
  >
  {% endif %} {% endfor %}
</nav>
